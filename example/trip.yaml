# yaml-language-server: $schema=../schema/problem.schema.json
#
# Not only interviews: two days away, by train, with a child. The model is
# turned around, and that is the whole trick:
#
#   - the "recruiter" Us is the family: it can only be in one place at a
#     time, and its availability is its days;
#   - every place is a "recruiter" too, whose availability is its opening
#     hours, day by day;
#   - every visit is a "candidate": a meeting between Us and a place.
#
# Three things carry the day, and each is a key of its own:
#
#   - required: the hotel and the trains. They are no achievement and the
#     day falls apart without them, so the program refuses a schedule that
#     drops them instead of quietly sending you to the market with the
#     suitcases.
#   - optional: a friend who comes along if she can. The visit never waits
#     for her and never depends on her.
#   - priority: what one would rather see, and what is a bonus.

from: 2026-12-21
to: 2026-12-22
day: 08:00-21:00
max-gap: unlimited
objectives: [priorities, recruiter-span, day-end]

# Three places, and every pair of them written out. No default here, and
# that is the point: a default journey links every pair of places, so two
# places are never more than twice the default apart. A default of 12m
# would quietly make the hotel 24 min from the next town instead of the
# 1h15 given. A default is only safe when every journey written below is
# shorter than it; here they are longer, so there is no default. Writing
# all three is not a free choice either — a pair with neither a line nor a
# default is refused.
#
# The two to the next town are the walk or the tram plus the train. The
# station is not a place of its own: nobody is ever there for its own sake,
# and a place nobody visits only widens the file.
travel:
  journeys:
    - [Hotel, Old town, 25m]
    - [Hotel, Next town, 1h15] # the tram to the station, then the train
    - [Old town, Next town, 1h07] # the walk to the station, then the train

recruiters:
  Us:
    min-gap: 20m # from one place to the next, at a child's pace
    availability:
      2026-12-21: 12:40-21:00 # the train gets in at 12:37
      2026-12-22: 08:00-18:30

  Friend: # to be replaced by her real hours
    availability:
      2026-12-21: 15:00-21:00

  Front desk:
    availability:
      2026-12-21: 13:00-21:00
      2026-12-22: 08:00-10:00

  Christmas market:
    availability:
      2026-12-21: 11:00-20:00
      2026-12-22: 11:00-18:00
  Cathedral:
    availability:
      2026-12-21: 09:30-17:45
      2026-12-22: 09:30-17:45
  Lit streets:
    availability: # illuminations: in the evening
      2026-12-21: 16:30-20:30
  Toy museum:
    availability:
      2026-12-22: 10:00-18:00

  # The train, as its timetable: a window the length of the journey, and
  # nothing else fits in it.
  Train out:
    availability: {2026-12-22: 09:10-10:15}
  Train back:
    availability: {2026-12-22: 17:00-18:10}

  Next town market:
    availability: {2026-12-22: 11:00-18:00}

candidates:
  # ---- what the day is built around: no interest, and no day without it
  Bags dropped at the hotel:
    meet: [Us, Front desk]
    together: true
    duration: 30m
    required: true
    place: Hotel
    availability: {2026-12-21: 13:00-15:00}
  Back to the hotel for the night:
    meet: [Us, Front desk]
    together: true
    duration: 15m
    required: true
    place: Hotel
    availability: {2026-12-21: 19:30-21:00}
  Room given back:
    meet: [Us, Front desk]
    together: true
    duration: 20m
    required: true
    place: Hotel
    availability: {2026-12-22: 08:00-09:00}
  # The two trains have no place, and that is deliberate: a candidate
  # without one happens on the way. The journey between the places on
  # either side of it is still counted — the hotel is 1h15 from the next
  # town whatever sits between them — so the train costs its own time and
  # not the ride twice. Giving it the station instead would charge the ride
  # once in the duration and once again in the journey out of the station.
  Train to the next town:
    meet: [Us, Train out]
    together: true
    duration: 1h05 # ten minutes early, then the journey
    required: true
  Train home:
    meet: [Us, Train back]
    together: true
    duration: 1h10
    required: true

  # ---- the visits. The friend comes along to two of them if she can.
  The Christmas market:
    meet: {Us: {}, Christmas market: {}, Friend: {optional: true}}
    together: true
    duration: 1h30
    priority: 2
    place: Old town
  The cathedral:
    meet: {Us: {}, Cathedral: {}, Friend: {optional: true}}
    together: true
    duration: 1h
    priority: 2
    place: Old town
  The lit streets:
    meet: [Us, Lit streets]
    together: true
    duration: 1h
    priority: 2
    place: Old town
  The market of the next town:
    meet: [Us, Next town market]
    together: true
    duration: 2h
    priority: 2
    place: Next town

  # ---- bonuses for the child, taken if there is room
  The toy museum:
    meet: [Us, Toy museum]
    together: true
    duration: 1h15
    place: Next town
