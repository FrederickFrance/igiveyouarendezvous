# yaml-language-server: $schema=../schema/problem.schema.json
#
# A tour: five episodes shot in five cities, each with a local guest. The
# host and the camera operator travel from one shoot to the next. Each
# episode is a "candidate" at its place, with its meetings: two scenes in
# the city with the host and the camera operator, an hour each, and the
# interview of the guest, two hours, in any order. Between two shoots in different cities,
# the team needs the journey: upper estimates, door to door, packing the
# gear included; the program computes no route.

from: 2026-11-16
to: 2026-11-20
day: 08:00-20:00
objectives: [complete-candidates, recruiters, day-end]   # every episode, then the fewest days

travel:
  default: 6h           # any journey not listed below
  journeys:
    - [Paris, Lille, 2h30]
    - [Paris, Lyon, 3h30]
    - [Paris, Bordeaux, 3h30]
    - [Lyon, Marseille, 3h]

recruiters:             # the people: the team, and the guests
  Host:
  Camera:
  Guest Lille:
    availability:
      2026-11-16: 14:00-20:00
      2026-11-17: 08:00-12:00
  Guest Paris:
  Guest Lyon:
    availability:
      2026-11-18: 08:00-20:00
      2026-11-19: 08:00-20:00
  Guest Marseille:
    availability:
      2026-11-19: 08:00-20:00
  Guest Bordeaux:
    availability:
      2026-11-16: 08:00-13:00
      2026-11-20: 08:00-20:00

candidates:             # the episodes, each at its place, shot in one go
  the archives of Lille:
    meetings:
      - {with: [Host, Camera], duration: 1h, times: 2}   # two scenes in the city
      - {with: [Host, Camera, Guest Lille], duration: 2h}
    place: Lille
  the Paris catacombs:
    meetings:
      - {with: [Host, Camera], duration: 1h, times: 2}   # two scenes in the city
      - {with: [Host, Camera, Guest Paris], duration: 2h}
    place: Paris
  the silk workers of Lyon:
    meetings:
      - {with: [Host, Camera], duration: 1h, times: 2}   # two scenes in the city
      - {with: [Host, Camera, Guest Lyon], duration: 2h}
    place: Lyon
  the old port of Marseille:
    meetings:
      - {with: [Host, Camera], duration: 1h, times: 2}   # two scenes in the city
      - {with: [Host, Camera, Guest Marseille], duration: 2h}
    place: Marseille
  the wine cellars of Bordeaux:
    meetings:
      - {with: [Host, Camera], duration: 1h, times: 2}   # two scenes in the city
      - {with: [Host, Camera, Guest Bordeaux], duration: 2h}
    place: Bordeaux
