# yaml-language-server: $schema=../../schema/problem.schema.json
#
# Une tournée : cinq épisodes tournés dans cinq villes, chacun avec un invité
# du coin. L'animatrice et le cadreur vont d'un tournage au suivant. Chaque
# épisode est un « candidat », à son lieu (place), avec ses rencontres :
# deux scènes en ville avec l'animatrice et le cadreur, une heure chacune, et
# l'entretien avec l'invité, deux heures, dans n'importe quel ordre. Entre deux tournages
# dans des villes différentes, l'équipe a besoin du trajet : des estimations
# hautes, de porte à porte, rangement du matériel compris ; le programme ne
# calcule aucun itinéraire.

from: 2026-11-16
to: 2026-11-20
day: 08:00-20:00
objectives: [complete-candidates, recruiters, day-end]   # tous les épisodes, puis le moins de jours

travel:
  default: 6h           # tout trajet qui n'est pas listé dessous
  journeys:
    - [Paris, Lille, 2h30]
    - [Paris, Lyon, 3h30]
    - [Paris, Bordeaux, 3h30]
    - [Lyon, Marseille, 3h]

recruiters:             # les personnes : l'équipe et les invités
  Animatrice:
  Cadreur:
  Invité Lille:
    availability:
      2026-11-16: 14:00-20:00
      2026-11-17: 08:00-12:00
  Invité Paris:
  Invité Lyon:
    availability:
      2026-11-18: 08:00-20:00
      2026-11-19: 08:00-20:00
  Invité Marseille:
    availability:
      2026-11-19: 08:00-20:00
  Invité Bordeaux:
    availability:
      2026-11-16: 08:00-13:00
      2026-11-20: 08:00-20:00

candidates:             # les épisodes, chacun à son lieu, tourné d'une traite
  les archives de Lille:
    meetings:
      - {with: [Animatrice, Cadreur], duration: 1h, times: 2}   # deux scènes en ville
      - {with: [Animatrice, Cadreur, Invité Lille], duration: 2h}
    place: Lille
  les catacombes de Paris:
    meetings:
      - {with: [Animatrice, Cadreur], duration: 1h, times: 2}   # deux scènes en ville
      - {with: [Animatrice, Cadreur, Invité Paris], duration: 2h}
    place: Paris
  les canuts de Lyon:
    meetings:
      - {with: [Animatrice, Cadreur], duration: 1h, times: 2}   # deux scènes en ville
      - {with: [Animatrice, Cadreur, Invité Lyon], duration: 2h}
    place: Lyon
  le vieux port de Marseille:
    meetings:
      - {with: [Animatrice, Cadreur], duration: 1h, times: 2}   # deux scènes en ville
      - {with: [Animatrice, Cadreur, Invité Marseille], duration: 2h}
    place: Marseille
  les chais de Bordeaux:
    meetings:
      - {with: [Animatrice, Cadreur], duration: 1h, times: 2}   # deux scènes en ville
      - {with: [Animatrice, Cadreur, Invité Bordeaux], duration: 2h}
    place: Bordeaux
