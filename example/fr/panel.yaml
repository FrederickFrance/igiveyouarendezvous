# yaml-language-server: $schema=../../schema/problem.schema.json
#
# Une commission de recrutement. Chaque candidat passe d'abord un entretien
# technique, puis rencontre la commission (la présidente, la RH et la
# manager) en une seule fois : un jury ne se sépare jamais, et personne
# d'autre ne s'y joint. Les rangs donnent l'ordre, et les écarts gardent les
# deux entretiens d'un candidat le même jour, rapprochés.

from: 2026-11-24
to: 2026-11-26
day: 08:30-17:30
breaks: 12:00-13:30
duration: 45m
min-gap: 0
max-gap: 1h

panels:                          # qui reçoit toujours ensemble
  - [Nadia (présidente), Paul (RH), Rose (manager)]

recruiters:
  Nadia (présidente):
    availability:
      2026-11-24: 08:30-17:30
      2026-11-26: 08:30-12:00
  Paul (RH):
  Rose (manager):
    availability: 08:30-12:00, 14:00-17:30
  Tom (technique):
    duration: 1h
  Yan (technique):
    duration: 1h
    availability:
      2026-11-25: 08:30-17:30
      2026-11-26: 08:30-17:30

candidates:                      # 1 : d'abord, 2 : ensuite
  Alix:
    meet: {Tom (technique): 1, Nadia (présidente): 2, Paul (RH): 2, Rose (manager): 2}
  Basile:
    meet: {Tom (technique): 1, Nadia (présidente): 2, Paul (RH): 2, Rose (manager): 2}
  Cyrine:
    meet: {Yan (technique): 1, Nadia (présidente): 2, Paul (RH): 2, Rose (manager): 2}
    availability:
      2026-11-26: 08:30-12:00
  Dorian:
    meet: {Tom (technique): 1, Nadia (présidente): 2, Paul (RH): 2, Rose (manager): 2}
  Eva:
    meet: {Yan (technique): 1, Nadia (présidente): 2, Paul (RH): 2, Rose (manager): 2}
  Félix:
    meet: {Tom (technique): 1, Nadia (présidente): 2, Paul (RH): 2, Rose (manager): 2}
    availability:
      2026-11-24: 14:00-17:30
