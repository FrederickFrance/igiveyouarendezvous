# yaml-language-server: $schema=../../schema/problem.schema.json
#
# Pas seulement des entretiens : deux jours de voyage en train, avec un
# enfant. Le modèle est retourné, et c'est tout l'astuce :
#
#   - le « recruteur » Nous, c'est la famille : elle ne peut être qu'à un
#     seul endroit à la fois, et ses disponibilités sont ses journées ;
#   - chaque lieu est un « recruteur » lui aussi, dont les disponibilités
#     sont ses heures d'ouverture, jour par jour ;
#   - chaque visite est un « candidat » : une rencontre entre Nous et un lieu.
#
# Trois choses portent la journée, et chacune a sa clef :
#
#   - required : l'hôtel et les trains. Ils ne sont aucun exploit et la
#     journée s'écroule sans eux, donc le programme refuse un planning qui
#     les abandonne au lieu de vous envoyer tranquillement au marché avec
#     les valises.
#   - optional : une amie qui se joint si elle peut. Aucune visite n'est
#     abandonnée pour elle : elle se tient sans elle quand elle n'est pas
#     libre.
#   - priority : ce qu'on préfère voir, et ce qui est un bonus.

from: 2026-12-21
to: 2026-12-22
day: 08:00-21:00
max-gap: unlimited

# « meetings » est ce qui invite l'amie. Une invitée coûte son temps comme
# tout le monde, et les rencontres tenues sont le seul objectif qui la
# compte : après les priorités, elle ne coûte jamais une visite ; avant le
# temps des recruteurs, sa compagnie vaut une heure du sien. Sans lui elle
# resterait chez elle, et -check le dirait.
objectives: [priorities, meetings, recruiter-span, day-end]

# Quatre trajets, et pas de défaut. Un défaut serait le piège ici : il relie
# tous les couples de lieux, donc deux lieux ne sont jamais à plus de deux
# fois le défaut, et un défaut de 12m mettrait l'hôtel à 24 min de la ville
# voisine. Un défaut n'est sûr que si tous les trajets écrits en dessous
# sont plus courts que lui.
#
# Rien ne dit l'hôtel à la ville voisine, et rien n'a à le dire : les
# trajets tiennent ensemble, donc cela coûte le tram jusqu'à la gare plus le
# train, 1h15. La gare n'est la destination de personne — aucun candidat n'y
# est — et elle porte quand même les deux trajets vers la ville voisine.
# Lancez -check pour voir les temps déduits ainsi avant de leur faire
# confiance.
travel:
  journeys:
    - [Hôtel, Gare, 20m]
    - [Hôtel, Vieille ville, 25m]
    - [Gare, Vieille ville, 12m]
    - [Gare, Ville voisine, 55m] # le train

recruiters:
  Nous:
    min-gap: 20m # d'un lieu au suivant, au pas d'un enfant
    availability:
      2026-12-21: 12:40-21:00 # le train arrive à 12:37
      2026-12-22: 08:00-18:30

  Amie: # à remplacer par ses vraies disponibilités
    availability:
      2026-12-21: 15:00-21:00

  Réception:
    availability:
      2026-12-21: 13:00-21:00
      2026-12-22: 08:00-10:00

  Marché de Noël:
    availability:
      2026-12-21: 11:00-20:00
      2026-12-22: 11:00-18:00
  Cathédrale:
    availability:
      2026-12-21: 09:30-17:45
      2026-12-22: 09:30-17:45
  Rues illuminées:
    availability: # les illuminations : le soir
      2026-12-21: 16:30-20:30
  Musée du jouet:
    availability:
      2026-12-22: 10:00-18:00

  # Le train, sous la forme de son horaire : une fenêtre de la longueur du
  # trajet, et rien d'autre n'y tient.
  Train aller:
    availability: {2026-12-22: 09:10-10:15}
  Train retour:
    availability: {2026-12-22: 17:00-18:10}

  Marché de la ville voisine:
    availability: {2026-12-22: 11:00-18:00}

candidates:
  # ---- ce autour de quoi la journée se construit : aucun intérêt, et pas de journée sans
  Bagages déposés à l'hôtel:
    meet: [Nous, Réception]
    together: true
    duration: 30m
    required: true
    place: Hôtel
    availability: {2026-12-21: 13:00-15:00}
  Retour à l'hôtel pour la nuit:
    meet: [Nous, Réception]
    together: true
    duration: 15m
    required: true
    place: Hôtel
    availability: {2026-12-21: 19:30-21:00}
  Chambre rendue:
    meet: [Nous, Réception]
    together: true
    duration: 20m
    required: true
    place: Hôtel
    availability: {2026-12-22: 08:00-09:00}
  # Les deux trains n'ont pas de lieu, et c'est volontaire : un candidat
  # sans lieu se passe en route. Le trajet entre les lieux de part et
  # d'autre est quand même compté — l'hôtel est à 1h15 de la ville voisine
  # quoi qu'il y ait entre les deux — donc le train coûte son temps à lui et
  # pas le voyage deux fois. Lui donner la gare facturerait le voyage une
  # fois dans la durée, puis encore une fois dans le trajet au départ de la gare.
  Train vers la ville voisine:
    meet: [Nous, Train aller]
    together: true
    duration: 1h05 # dix minutes d'avance, puis le trajet
    required: true
  Train du retour:
    meet: [Nous, Train retour]
    together: true
    duration: 1h10
    required: true

  # ---- les visites. L'amie se joint à deux d'entre elles si elle peut.
  Le marché de Noël:
    meet: {Nous: {}, Marché de Noël: {}, Amie: {optional: true}}
    together: true
    duration: 1h30
    priority: 2
    place: Vieille ville
  La cathédrale:
    meet: {Nous: {}, Cathédrale: {}, Amie: {optional: true}}
    together: true
    duration: 1h
    priority: 2
    place: Vieille ville
  Les rues illuminées:
    meet: [Nous, Rues illuminées]
    together: true
    duration: 1h
    priority: 2
    place: Vieille ville
  Le marché de la ville voisine:
    meet: [Nous, Marché de la ville voisine]
    together: true
    duration: 2h
    priority: 2
    place: Ville voisine

  # ---- les bonus pour l'enfant, pris s'il reste de la place
  Le musée du jouet:
    meet: [Nous, Musée du jouet]
    together: true
    duration: 1h15
    place: Ville voisine
