# yaml-language-server: $schema=../schema/problem.schema.json
#
# The problem to plan: who must meet whom, when everybody is available, and
# the settings. Only recruiters and candidates are mandatory: by default, the
# day runs from 08:00 to 12:00, interviews last one hour, every candidate
# meets all their recruiters the same day, and their interviews follow each
# other.

# Default availability of everybody; several time spans may be given,
# separated by commas.
day: 08:00-17:00

# Breaks, such as lunch: no interview then, and the interviews of a
# candidate never lie on both sides of a break. The longest break separates
# the morning from the afternoon.
breaks: 12:00-13:30

# Default interview length: 45m, 1h, 1h30 or a number of minutes.
# A joint interview lasts as long as its longest part.
duration: 1h

# Total time a candidate may wait between their interviews:
# 0 = they follow each other, "unlimited" = no limit.
max-wait: 0

# Recruiters who may hold joint interviews: a candidate may meet several
# recruiters of a same group in one interview. A recruiter may belong to
# several groups; one of no group (here recruiter 1) always interviews alone.
# Without groups, every interview is one-to-one.
joint-groups:
  - [recruiter 2, recruiter 3, recruiter 5]
  - [recruiter 4, recruiter 5]

# Objectives, the most important first
# (the full list: igiveyouarendezvous -list-objectives).
objectives:
  - priorities            # complete candidates, priority level by priority level
  - meetings
  - recruiters            # recruiters with an interview in the day
  - recruiter-half-days   # their half-days (morning, afternoon) with an interview
  - interviews
  - recruiter-span

# The recruiters. Availabilities are the same every day, or given by date: a
# person whose availability is given by date is absent on the other dates,
# and the day to plan is then chosen with -date 2026-11-03.
recruiters:
  recruiter 1:
    duration: 30m
    availability: 09:00-12:00
  recruiter 2:              # the defaults: the day, one-hour interviews
  recruiter 3:
  recruiter 4:
    availability: 08:00-10:00, 14:00-17:00
  recruiter 5:

# The candidates and the recruiters each of them must meet. A candidate of
# a higher priority goes before any number of candidates of a lower one (1
# by default): here, candidate C has already passed preliminary interviews.
candidates:
  candidate A:
    meet: [recruiter 1, recruiter 2, recruiter 3]
  candidate B:
    meet: [recruiter 3]
    availability:
      2026-11-03: none
      2026-11-04: 08:00-12:00
  candidate C:
    meet: [recruiter 4, recruiter 5]
    priority: 2
  candidate D:
    meet: [recruiter 1, recruiter 2, recruiter 5]
    availability:
      2026-11-03: 09:00-12:00
      2026-11-04: 14:00-17:00
