# golangci-lint v2 configuration: strict, with the project's conventions.
version: "2"

linters:
  default: none
  enable:
    # Bugs
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errorlint        # errors.Is / errors.As instead of == and type switches
    - nilerr
    - nilnil
    - forcetypeassert
    - exhaustive       # every Objective in a switch, or an explicit default
    - copyloopvar
    - gosec
    - bodyclose
    - wastedassign
    - unparam
    - unconvert
    # Style and documentation
    - revive           # exported identifiers are documented (godoc)
    - godot            # comments are sentences
    - gocritic
    - misspell
    - predeclared
    - intrange
    - modernize        # the simplifications VS Code (gopls) suggests
    - usestdlibvars
    - perfsprint
    - nakedret
    - whitespace
    - errname
    - nolintlint
    # Complexity
    - gocyclo
    - nestif
    # Tests
    - testifylint
    - tparallel
    - paralleltest     # every test calls t.Parallel()

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # readability first
        - shadow         # err := shadowing is idiomatic
    staticcheck:
      checks: [all]
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: receiver-naming
        - name: increment-decrement
        - name: indent-error-flow
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: context-as-argument
        - name: time-naming
        - name: empty-block
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks:
        - hugeParam    # Options and Interval are passed by value on purpose
        - unnamedResult
        - whyNoLint
    gocyclo:
      min-complexity: 30 # the search and the model have long, linear functions
    nestif:
      min-complexity: 6
    exhaustive:
      default-signifies-exhaustive: true
    godot:
      scope: declarations
    errcheck:
      exclude-functions: # printing to the terminal: nothing sensible to do on failure
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush

  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, gocyclo, forcetypeassert]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/FrederickFrance/igiveyouarendezvous
