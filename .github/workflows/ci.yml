# Continuous integration: the GitHub equivalent of a .gitlab-ci.yml.
# Jobs run in parallel on every push and pull request, and every Monday for
# the vulnerability scan (new vulnerabilities appear without code changes).
name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"] # path filters never apply to tags
    paths-ignore: # documentation only: nothing to test
      - "**.md"
      - "prompt/**"
      - "LICENSE"
      - "WTFPL.txt"
      - ".github/ISSUE_TEMPLATE/**"
      - "docs/**"
  # Every pull request, documentation alone included: the branches require
  # these checks before a merge, and a check that never runs never passes.
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch: # "Run workflow" button

permissions:
  contents: read

# A new commit on a pull request cancels the run of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # the Go of the build is the one of go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: Tests, with the coverage
        run: go test -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

  # The race detector slows the program down several times over: it runs
  # apart, beside the tests above, and leaves out the comparisons with an
  # exhaustive search (-short): they share nothing between goroutines, so
  # the detector has nothing to find there, and they take most of the time
  # of the suite.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tests, with the race detector
        run: go test -race -short ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0 # 2.13 cannot read the export data of Go 1.27

  # osv-scanner, which runs govulncheck on Go code. The official reusable
  # workflow runs a scanner that is already built, which matters more than it
  # sounds: "go install osv-scanner@latest" compiled the scanner here on
  # every run, and so pulled the whole of its dependency tree — none of it
  # ours. A flaky download of one of those, deep in a tree we do not depend
  # on, failed this job on 16 November with an HTTP/2 stream error. Nothing
  # we can fix, and nothing we should have been downloading.
  #
  # The version is pinned for the same reason it is pinned everywhere else:
  # at @latest the scanner changes under us, and the build breaks for a
  # reason that has nothing to do with the commit that broke it.
  #
  # security-events: write uploads the findings to the Security tab, which is
  # free on a public repository. The default arguments are --recursive ./.
  security:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1"
    permissions:
      actions: read
      contents: read
      security-events: write

  # The online demo (web/) runs the program compiled to WebAssembly: its
  # tests run the same way, by Node.js, and the demo must build.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tests compiled to WebAssembly, run by Node.js
        # env -i: a Go program run by Node.js accepts little environment.
        run: |
          goroot=$(go env GOROOT)
          env -i PATH="$goroot/lib/wasm:$PATH" HOME="$HOME" GOPATH="$(go env GOPATH)" GOCACHE="$(go env GOCACHE)" \
            GOTOOLCHAIN=local GOOS=js GOARCH=wasm go test -short ./...
      - run: sh scripts/web.sh
