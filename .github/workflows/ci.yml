# Continuous integration: the GitHub equivalent of a .gitlab-ci.yml.
# Jobs run in parallel on every push and pull request, and every Monday for
# the vulnerability scan (new vulnerabilities appear without code changes).
name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"] # path filters never apply to tags
    paths-ignore: # documentation only: nothing to test
      - "**.md"
      - "prompt/**"
      - "LICENSE"
      - "WTFPL.txt"
      - ".github/ISSUE_TEMPLATE/**"
      - "docs/**"
      - "lol/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "prompt/**"
      - "LICENSE"
      - "WTFPL.txt"
      - ".github/ISSUE_TEMPLATE/**"
      - "docs/**"
      - "lol/**"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch: # "Run workflow" button

permissions:
  contents: read

# A new commit on a pull request cancels the run of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # the Go of the build is the one of go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: Tests, with the race detector and the coverage
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0 # 2.13 cannot read the export data of Go 1.27

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: osv-scanner (runs govulncheck on Go code)
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          osv-scanner scan source -r .

  # The online demo (web/) runs the program compiled to WebAssembly: its
  # tests run the same way, by Node.js, and the demo must build.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tests compiled to WebAssembly, run by Node.js
        # env -i: a Go program run by Node.js accepts little environment.
        run: |
          goroot=$(go env GOROOT)
          env -i PATH="$goroot/lib/wasm:$PATH" HOME="$HOME" GOPATH="$(go env GOPATH)" GOCACHE="$(go env GOCACHE)" \
            GOTOOLCHAIN=local GOOS=js GOARCH=wasm go test -short ./...
      - run: sh scripts/web.sh
