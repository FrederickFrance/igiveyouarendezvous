# Publishes a release when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tests run first, then the ready-to-use zips of scripts/package.sh
# (Windows, Mac with an Apple or Intel chip, Linux) are attached to the
# release, for the people who do not install Go (see the tutorial of the
# README).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: sh scripts/package.sh "$GITHUB_REF_NAME" # sh: works even if the executable bit is lost
      - name: Release with the zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: | # the title and the notes come from the section of the version in CHANGELOG.md
          title=$(sh scripts/title.sh "$GITHUB_REF_NAME") # v0.4.0 Cinderella 👠
          sh scripts/notes.sh "$GITHUB_REF_NAME" > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$title" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$title" --generate-notes
          fi
