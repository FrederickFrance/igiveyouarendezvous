# The online demo (web/), built by scripts/web.sh and published on GitHub
# Pages whenever main changes, or with the "Run workflow" button. Pages must
# first be set to "GitHub Actions" in Settings > Pages > Build and deployment.
name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: # one publication at a time, none cancelled halfway
  group: pages
  cancel-in-progress: false

jobs:
  # Built in one job and deployed in another, so that a deployment that fails
  # can be run again alone ("Re-run failed jobs"): run again in the job that
  # uploads it, the site is uploaded twice, and the deployment refuses to
  # choose between two artifacts named github-pages.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sh scripts/web.sh site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
