name: An idea
description: A rule the program cannot express, a feature, another use.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! You may write in English or in French. The most useful
        is a real situation, described as you would to a colleague; this
        issue is public, so leave out the real names.
  - type: textarea
    id: situation
    attributes:
      label: Your situation
      description: Who must meet whom, and the rule you cannot write in the problem file today.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: By hand, with another tool, with a trick in the problem file…
