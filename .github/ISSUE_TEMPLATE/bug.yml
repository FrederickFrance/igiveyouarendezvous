name: Something does not work
description: An error, a wrong or surprising schedule, a problem with the demo.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time! You may write in English or in French.

        **This issue is public:** replace the real names by placeholders
        (`Candidate 1`, initials…) before pasting a file.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - The online demo
        - The program (a release)
        - The Go library
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release (such as v0.3.0); for the demo, leave it empty.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what the program or the demo answered (the message, or what is wrong in the schedule).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: problem
    attributes:
      label: The problem file
      description: The file you planned, or the smallest part of it that shows the problem. It is shown as YAML.
      render: yaml
  - type: checkboxes
    id: privacy
    attributes:
      label: Personal data
      options:
        - label: What I paste holds no real names or other personal data.
          required: true
