# Dependabot opens a pull request when a dependency (Go module or GitHub
# action) has a new version; the CI then tells whether it can be merged.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: dev # the work goes through dev, then main
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
